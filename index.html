
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蝦皮雙寶｜推廣連結轉換器</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:25px 15px;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#fff0df,#ffc4a8);
}
.card{
 max-width:520px;margin:30px auto;
 padding:25px;background:white;
 border-radius:22px;
 box-shadow:0 8px 25px #0002;
}
h1{text-align:center;color:#ee4d2d}
.sub{text-align:center;color:#888;font-size:14px}
label{display:block;margin:22px 0 8px;font-weight:bold}
textarea{
 width:100%;height:150px;padding:14px;
 border:1px solid #ddd;border-radius:12px;
 font-size:15px;
}
button{
 width:100%;padding:15px;margin-top:12px;
 border:0;border-radius:12px;
 background:#ee4d2d;color:white;
 font-size:16px;font-weight:bold;
}
#result{
 margin-top:15px;padding:15px;
 background:#fff6f1;border-radius:10px;
 color:#555;word-break:break-all;
}
footer{text-align:center;color:#999;font-size:13px}
</style>
</head>
<body>
<div class="card">
<h1>🦐 蝦皮雙寶</h1>
<p class="sub">好康優惠・分享省錢・一起挖寶</p>

<label>📥 貼上蝦皮商品網址（一行一筆）</label>
<textarea id="urls" placeholder="請貼上蝦皮商品網址..."></textarea>

<button onclick="convert()">🚀 立即轉換連結</button>
<button onclick="clearAll()" style="background:#888">清空內容</button>

<div id="result">
🔗 轉換結果將顯示在這裡
</div>

<footer>❤️ 蝦皮雙寶陪你一起省錢</footer>
</div>

<script>
function convert(){
 const value=document.getElementById("urls").value.trim();
 if(!value){
  alert("請先貼上蝦皮商品網址");
  return;
 }
 document.getElementById("result").textContent=
 "目前正在設定專屬推廣轉換服務，尚未開始轉換。";
}
function clearAll(){
 document.getElementById("urls").value="";
 document.getElementById("result").textContent=
 "🔗 轉換結果將顯示在這裡";
}
</script>
</body>
</html>
